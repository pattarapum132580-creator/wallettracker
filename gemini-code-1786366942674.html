<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>บันทึกเงินพกพา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12241c;
    --bg-deep: #0b1913;
    --panel: #1c3629;
    --panel-light: #234433;
    --border: #4f8f6a;
    --border-dim: #2f5940;
    --gold: #e8c547;
    --gold-dim: #a68a2f;
    --income: #7fd858;
    --expense: #ff8a75;
    --text: #e9f4e6;
    --text-dim: #9dbba9;
    --font-pixel: 'Press Start 2P', monospace;
    --font-body: 'IBM Plex Sans Thai', sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg-deep);
    background-image:
      linear-gradient(var(--bg) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 16px;
    padding-bottom: 90px; /* เว้นที่ให้ Bottom Nav */
  }

  .pixel-box{
    background: var(--panel);
    border: 3px solid var(--border);
    clip-path: polygon(
      0 10px, 10px 10px, 10px 0,
      calc(100% - 10px) 0, calc(100% - 10px) 10px, 100% 10px,
      100% calc(100% - 10px), calc(100% - 10px) calc(100% - 10px), calc(100% - 10px) 100%,
      10px 100%, 10px calc(100% - 10px), 0 calc(100% - 10px)
    );
  }

  header{ text-align:center; margin-bottom: 16px; }
  .coin{ display:inline-block; width:18px; height:18px; background: var(--gold); border-radius:50%; box-shadow: inset -3px -3px 0 var(--gold-dim); vertical-align:middle; margin-right:8px; }
  h1{
    font-family: var(--font-pixel);
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 1px;
    margin: 0;
  }

  /* View Sections (สลับหน้า) */
  .view-section { display: none; }
  .view-section.active { display: block; }

  .card{ padding: 16px; margin-bottom: 14px; }
  .card-label{ font-family: var(--font-pixel); font-size: 9px; color: var(--text-dim); margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center; }
  .icon-btn{ background: none; border: 2px solid var(--border-dim); color: var(--text-dim); font-size: 12px; padding: 4px 8px; cursor: pointer; font-family: var(--font-body); }

  .today-amount{ font-family: var(--font-pixel); font-size: 26px; color: var(--expense); text-shadow: 2px 2px 0 rgba(0,0,0,.4); word-break: break-all; }
  .today-income-line{ margin-top: 8px; font-size: 13px; color: var(--income); }

  .budget-row{ display:flex; justify-content:space-between; font-size:12px; color: var(--text-dim); margin-bottom:6px; }
  .budget-row b{ color: var(--text); }
  .budget-empty{ font-size:12px; color: var(--text-dim); text-align:center; padding: 6px 0; }

  .tx-list{ list-style:none; margin: 12px 0 0; padding:0; }
  .tx-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding: 10px 4px; border-bottom: 1px dashed var(--border-dim); cursor:pointer; }
  .tx-row:last-child{ border-bottom:none; }
  .tx-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .tx-icon{ width:28px; height:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background: var(--panel-light); border: 2px solid var(--border-dim); font-size:14px; }
  .tx-meta{ min-width:0; }
  .tx-cat{ font-size: 13px; font-weight:600; }
  .tx-note{ font-size: 11px; color: var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 40vw; }
  .tx-amount{ font-family: var(--font-pixel); font-size: 11px; white-space:nowrap; }
  .tx-amount.expense{ color: var(--expense); }
  .tx-amount.income{ color: var(--income); }
  .tx-del{ background:none; border:none; color: var(--text-dim); font-size:16px; cursor:pointer; padding: 4px 8px; }

  .section-title{ font-family: var(--font-pixel); font-size: 10px; color: var(--gold); margin: 16px 4px 10px; display:flex; justify-content:space-between; align-items:center; }
  .backup-links{ font-family: var(--font-body); font-size:11px; color: var(--text-dim); }
  .backup-links span{ text-decoration: underline; cursor:pointer; }

  .recur-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding: 10px 4px; border-bottom: 1px dashed var(--border-dim); }
  .recur-actions{ display:flex; align-items:center; gap:4px; }
  .add-recur-btn{ background: var(--panel-light); color: var(--gold); border: 2px solid var(--gold-dim); font-size:11px; padding: 5px 9px; cursor:pointer; }
  .toggle-recur-form{ width:100%; margin-top: 10px; background: var(--panel-light); border:2px dashed var(--border); color: var(--text); padding:10px; text-align:center; font-size:13px; cursor:pointer; }
  .recur-form{ margin-top:12px; }

  details.month-card{ margin-bottom: 10px; }
  summary.month-summary{ padding: 12px 14px; cursor:pointer; list-style:none; }
  .month-row-top{ display:flex; justify-content:space-between; align-items:center; }
  .month-name{ font-weight:600; font-size:14px; }
  .month-net{ font-family: var(--font-pixel); font-size: 11px; }
  .month-net.pos{ color: var(--income); }
  .month-net.neg{ color: var(--expense); }
  .month-sub{ display:flex; gap:14px; margin-top:6px; font-size:11px; color: var(--text-dim); }
  .bar-track{ height:8px; background: var(--bg-deep); border:1px solid var(--border-dim); margin-top:8px; }
  .bar-fill{ height:100%; background: var(--expense); }
  .bar-fill.ok{ background: var(--gold); }
  .month-tx{ padding: 0 14px 14px; }
  .cat-breakdown{ padding: 4px 14px 14px; border-bottom: 1px solid var(--border-dim); }
  .cat-breakdown-title{ font-size:11px; color: var(--text-dim); margin-bottom:8px; }
  .cat-bd-row{ margin-bottom:6px; }
  .cat-bd-top{ display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; }
  .cat-bd-track{ height:6px; background: var(--bg-deep); border:1px solid var(--border-dim); }
  .cat-bd-fill{ height:100%; background: var(--gold); }

  /* Bottom Navigation Bar */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: var(--panel);
    border-top: 3px solid var(--border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 40;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    flex: 1;
    height: 100%;
    border: none;
    background: none;
  }
  .nav-item.active {
    color: var(--gold);
    font-weight: bold;
  }
  .nav-icon {
    font-size: 18px;
    margin-bottom: 2px;
  }

  /* FAB Add Button */
  .fab{
    position: fixed; right: 18px; bottom: 78px;
    width: 52px; height: 52px;
    background: var(--gold); color: var(--bg-deep);
    border: 3px solid var(--gold-dim);
    font-family: var(--font-pixel);
    font-size: 22px;
    cursor: pointer;
    clip-path: polygon(0 8px, 8px 8px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px));
    box-shadow: 0 4px 0 rgba(0,0,0,.4);
    z-index: 45;
  }

  /* Form & Overlays */
  .overlay{
    position: fixed; inset:0; background: rgba(5,12,9,.85);
    display:flex; align-items:flex-end; justify-content:center;
    z-index: 50;
  }
  .sheet{
    width:100%; max-width: 480px;
    background: var(--panel);
    border-top: 3px solid var(--border);
    padding: 18px 16px 24px;
    max-height: 88vh; overflow-y:auto;
    position:relative;
  }
  .sheet-title{ font-family: var(--font-pixel); font-size:12px; color: var(--gold); margin-bottom:16px; }
  .type-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .type-btn{ flex:1; padding:10px; text-align:center; font-weight:600; cursor:pointer; background: var(--panel-light); border: 2px solid var(--border-dim); color: var(--text-dim); font-size:13px; }
  .type-btn.active-expense{ background: var(--expense); border-color: var(--expense); color: #331711; }
  .type-btn.active-income{ background: var(--income); border-color: var(--income); color: #133311; }

  label{ display:block; font-size:12px; color: var(--text-dim); margin: 12px 0 6px; }
  input[type=text], input[type=number], input[type=date]{
    width:100%; padding:10px; background: var(--bg-deep); border: 2px solid var(--border-dim); color: var(--text);
    font-family: var(--font-body); font-size:14px;
  }
  .cat-grid{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .cat-chip{ padding: 6px 10px; background: var(--bg-deep); border:2px solid var(--border-dim); font-size:12px; cursor:pointer; color: var(--text-dim); }
  .cat-chip.selected{ border-color: var(--gold); color: var(--gold); }

  .btn-row{ display:flex; gap:10px; margin-top:18px; }
  .btn{ flex:1; padding:12px; text-align:center; font-family: var(--font-pixel); font-size:10px; cursor:pointer; border:2px solid; }
  .btn-secondary{ background: var(--panel-light); border-color: var(--border-dim); color: var(--text-dim); }
  .btn-primary{ background: var(--gold); border-color: var(--gold-dim); color: var(--bg-deep); }
  .btn-danger{ background: var(--expense); border-color: #7a3a2e; color: #331711; }
  .btn-scan{ width:100%; margin-top: 6px; background: var(--panel-light); border:2px dashed var(--border); color: var(--text); padding:12px; text-align:center; font-size:13px; cursor:pointer; }
  .close-x{ position:absolute; top:10px; right:14px; background:none; border:none; color: var(--text-dim); font-size:20px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1><span class="coin"></span>บันทึกเงินพกพา</h1>
</header>

<div id="viewToday" class="view-section active">
  <div class="card pixel-box" id="budgetCard">
    <div class="card-label"><span>งบประมาณเดือนนี้</span><button class="icon-btn" id="editBudgetBtn">แก้ไข</button></div>
    <div id="budgetContent"></div>
  </div>

  <div class="card pixel-box" id="todayCard">
    <div class="card-label"><span>รายจ่ายวันนี้</span></div>
    <div class="today-amount" id="todayExpense">฿0.00</div>
    <div class="today-income-line" id="todayIncome">รายรับวันนี้: ฿0.00</div>
    <ul class="tx-list" id="todayList"></ul>
  </div>
</div>

<div id="viewRecurring" class="view-section">
  <div class="section-title"><span>ค่าใช้จ่ายประจำ</span></div>
  <div class="card pixel-box" id="recurCard">
    <div id="recurList"></div>
    <button class="toggle-recur-form" id="toggleRecurForm">+ เพิ่มรายการประจำ</button>
    <div class="recur-form" id="recurForm" style="display:none;">
      <div class="type-toggle">
        <div class="type-btn" id="recurBtnExpense">รายจ่าย</div>
        <div class="type-btn" id="recurBtnIncome">รายรับ</div>
      </div>
      <label for="recurAmount">จำนวนเงิน (บาท)</label>
      <input type="number" id="recurAmount" inputmode="decimal" step="0.01" placeholder="0.00">
      <label>หมวดหมู่</label>
      <div class="cat-grid" id="recurCatGrid"></div>
      <label for="recurNote">โน้ต (ไม่บังคับ)</label>
      <input type="text" id="recurNote" placeholder="เช่น ค่าหอพัก, ค่าเน็ต">
      <div class="btn-row">
        <div class="btn btn-secondary" id="recurCancelBtn">ยกเลิก</div>
        <div class="btn btn-primary" id="recurSaveBtn">บันทึกรายการประจำ</div>
      </div>
    </div>
  </div>
</div>

<div id="viewMonthly" class="view-section">
  <div class="section-title">
    <span>สรุปรายเดือน</span>
    <span class="backup-links">
      <span id="exportBtn">ส่งออก</span> · <span id="importBtn">นำเข้า</span>
    </span>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none;">
  <div id="monthList"></div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('today', this)">
    <span class="nav-icon">📅</span>
    <span>รายจ่ายวันนี้</span>
  </button>
  <button class="nav-item" onclick="switchTab('recurring', this)">
    <span class="nav-icon">🔄</span>
    <span>รายการประจำ</span>
  </button>
  <button class="nav-item" onclick="switchTab('monthly', this)">
    <span class="nav-icon">📊</span>
    <span>สรุปรายเดือน</span>
  </button>
</nav>

<button class="fab" id="fabAdd" aria-label="เพิ่มรายการ">+</button>

<div class="overlay" id="overlay" style="display:none;">
  <div class="sheet">
    <button class="close-x" id="closeSheet" aria-label="ปิด">✕</button>
    <div class="sheet-title" id="sheetTitle">▸ เพิ่มรายการ</div>

    <div class="type-toggle">
      <div class="type-btn" id="btnExpense">รายจ่าย</div>
      <div class="type-btn" id="btnIncome">รายรับ</div>
    </div>

    <button class="btn-scan" id="scanBtn">📷 สแกนสลิปเพื่ออ่านยอดเงินอัตโนมัติ</button>
    <input type="file" id="slipInput" accept="image/*" style="display:none;">

    <label for="amountInput">จำนวนเงิน (บาท)</label>
    <input type="number" id="amountInput" inputmode="decimal" step="0.01" placeholder="0.00">

    <label>หมวดหมู่</label>
    <div class="cat-grid" id="catGrid"></div>

    <label for="dateInput">วันที่</label>
    <input type="date" id="dateInput">

    <label for="noteInput">โน้ต (ไม่บังคับ)</label>
    <input type="text" id="noteInput" placeholder="เช่น ข้าวเที่ยง, ค่ารถ">

    <div class="btn-row">
      <div class="btn btn-secondary" id="cancelBtn">ยกเลิก</div>
      <div class="btn btn-primary" id="saveBtn">บันทึก</div>
    </div>
  </div>
</div>

<script>
// ฟังก์ชั่นสลับ Tab หน้าจอ
function switchTab(tabName, btnElement) {
  document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  
  if(tabName === 'today') document.getElementById('viewToday').classList.add('active');
  if(tabName === 'recurring') document.getElementById('viewRecurring').classList.add('active');
  if(tabName === 'monthly') document.getElementById('viewMonthly').classList.add('active');
  
  btnElement.classList.add('active');
}
</script>
</body>
</html>
