<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>บันทึกเงินพกพา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --bg: #12241c;
    --bg-deep: #0b1913;
    --panel: #1c3629;
    --panel-light: #234433;
    --border: #4f8f6a;
    --border-dim: #2f5940;
    --gold: #e8c547;
    --gold-dim: #a68a2f;
    --income: #7fd858;
    --expense: #ff8a75;
    --text: #e9f4e6;
    --text-dim: #9dbba9;
    --font-pixel: 'Press Start 2P', monospace;
    --font-body: 'IBM Plex Sans Thai', sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg-deep);
    background-image:
      linear-gradient(var(--bg) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 16px;
    padding-bottom: 100px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  :focus-visible{ outline: 3px solid var(--gold); outline-offset: 2px; }

  .pixel-box{
    background: var(--panel);
    border: 3px solid var(--border);
    clip-path: polygon(
      0 10px, 10px 10px, 10px 0,
      calc(100% - 10px) 0, calc(100% - 10px) 10px, 100% 10px,
      100% calc(100% - 10px), calc(100% - 10px) calc(100% - 10px), calc(100% - 10px) 100%,
      10px 100%, 10px calc(100% - 10px), 0 calc(100% - 10px)
    );
  }

  header{ text-align:center; margin-bottom: 20px; }
  .coin{ display:inline-block; width:20px; height:20px; background: var(--gold); border-radius:50%; box-shadow: inset -3px -3px 0 var(--gold-dim); vertical-align:middle; margin-right:8px; }
  h1{
    font-family: var(--font-pixel);
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 1px;
    margin: 0;
    line-height: 1.8;
  }
  .subtitle{ color: var(--text-dim); font-size: 12px; margin-top: 6px; }

  .today-card{ padding: 18px; margin-bottom: 16px; }
  .today-label{ font-family: var(--font-pixel); font-size: 9px; color: var(--text-dim); margin-bottom: 10px; }
  .today-amount{ font-family: var(--font-pixel); font-size: 26px; color: var(--expense); text-shadow: 2px 2px 0 rgba(0,0,0,.4); word-break: break-all; }
  .today-income-line{ margin-top: 8px; font-size: 13px; color: var(--income); }

  .tx-list{ list-style:none; margin: 12px 0 0; padding:0; }
  .tx-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding: 10px 4px; border-bottom: 1px dashed var(--border-dim); }
  .tx-row:last-child{ border-bottom:none; }
  .tx-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .tx-icon{ width:28px; height:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background: var(--panel-light); border: 2px solid var(--border-dim); font-size:14px; }
  .tx-meta{ min-width:0; }
  .tx-cat{ font-size: 13px; font-weight:600; }
  .tx-note{ font-size: 11px; color: var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 40vw; }
  .tx-amount{ font-family: var(--font-pixel); font-size: 11px; white-space:nowrap; }
  .tx-amount.expense{ color: var(--expense); }
  .tx-amount.income{ color: var(--income); }
  .tx-del{ background:none; border:none; color: var(--text-dim); font-size:16px; cursor:pointer; padding: 4px 8px; }
  .tx-del:hover{ color: var(--expense); }
  .empty-note{ color: var(--text-dim); font-size: 12px; text-align:center; padding: 14px 0; }

  .section-title{ font-family: var(--font-pixel); font-size: 10px; color: var(--gold); margin: 22px 4px 10px; display:flex; justify-content:space-between; align-items:center; }
  .backup-links{ font-family: var(--font-body); font-size:11px; color: var(--text-dim); }
  .backup-links span{ text-decoration: underline; cursor:pointer; }
  .backup-links span:hover{ color: var(--gold); }

  details.month-card{ margin-bottom: 10px; }
  summary.month-summary{ padding: 12px 14px; cursor:pointer; list-style:none; }
  summary.month-summary::-webkit-details-marker{ display:none; }
  .month-row-top{ display:flex; justify-content:space-between; align-items:center; }
  .month-name{ font-weight:600; font-size:14px; }
  .month-net{ font-family: var(--font-pixel); font-size: 11px; }
  .month-net.pos{ color: var(--income); }
  .month-net.neg{ color: var(--expense); }
  .month-sub{ display:flex; gap:14px; margin-top:6px; font-size:11px; color: var(--text-dim); }
  .bar-track{ height:8px; background: var(--bg-deep); border:1px solid var(--border-dim); margin-top:8px; }
  .bar-fill{ height:100%; background: var(--expense); }
  .month-tx{ padding: 0 14px 14px; }

  .fab{
    position: fixed; right: 18px; bottom: 18px;
    width: 56px; height: 56px;
    background: var(--gold); color: var(--bg-deep);
    border: 3px solid var(--gold-dim);
    font-family: var(--font-pixel);
    font-size: 22px;
    cursor: pointer;
    clip-path: polygon(0 8px, 8px 8px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px));
    box-shadow: 0 4px 0 rgba(0,0,0,.4);
  }
  .fab:active{ transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.4); }

  .overlay{
    position: fixed; inset:0; background: rgba(5,12,9,.85);
    display:flex; align-items:flex-end; justify-content:center;
    z-index: 50;
  }
  .sheet{
    width:100%; max-width: 480px;
    background: var(--panel);
    border-top: 3px solid var(--border);
    padding: 18px 16px 24px;
    max-height: 88vh; overflow-y:auto;
    position:relative;
  }
  .sheet-title{ font-family: var(--font-pixel); font-size:12px; color: var(--gold); margin-bottom:16px; }
  .type-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .type-btn{ flex:1; padding:10px; text-align:center; font-weight:600; cursor:pointer; background: var(--panel-light); border: 2px solid var(--border-dim); color: var(--text-dim); font-size:13px; }
  .type-btn.active-expense{ background: var(--expense); border-color: var(--expense); color: #331711; }
  .type-btn.active-income{ background: var(--income); border-color: var(--income); color: #133311; }

  label{ display:block; font-size:12px; color: var(--text-dim); margin: 12px 0 6px; }
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; padding:10px; background: var(--bg-deep); border: 2px solid var(--border-dim); color: var(--text);
    font-family: var(--font-body); font-size:14px;
  }
  input:focus, select:focus, textarea:focus{ border-color: var(--gold); }
  .cat-grid{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .cat-chip{ padding: 6px 10px; background: var(--bg-deep); border:2px solid var(--border-dim); font-size:12px; cursor:pointer; color: var(--text-dim); }
  .cat-chip.selected{ border-color: var(--gold); color: var(--gold); }

  .btn-row{ display:flex; gap:10px; margin-top:18px; }
  .btn{ flex:1; padding:12px; text-align:center; font-family: var(--font-pixel); font-size:10px; cursor:pointer; border:2px solid; }
  .btn-secondary{ background: var(--panel-light); border-color: var(--border-dim); color: var(--text-dim); }
  .btn-primary{ background: var(--gold); border-color: var(--gold-dim); color: var(--bg-deep); }
  .btn-scan{ width:100%; margin-top: 6px; background: var(--panel-light); border:2px dashed var(--border); color: var(--text); padding:12px; text-align:center; font-size:13px; cursor:pointer; }

  .ocr-status{ margin-top:10px; font-size:12px; color: var(--gold); text-align:center; }
  .ocr-raw{ margin-top:8px; font-size:11px; color: var(--text-dim); background: var(--bg-deep); padding:8px; border:1px dashed var(--border-dim); max-height:120px; overflow-y:auto; white-space:pre-wrap; }
  .close-x{ position:absolute; top:10px; right:14px; background:none; border:none; color: var(--text-dim); font-size:20px; cursor:pointer; }

  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .loading-dot{ animation: blink 1s infinite; }
</style>
</head>
<body>

<header>
  <h1><span class="coin"></span>บันทึกเงินพกพา</h1>
  <div class="subtitle">สแกนสลิป หรือกรอกเอง แล้วดูสรุปรายวัน/รายเดือน</div>
</header>

<div class="today-card pixel-box" id="todayCard">
  <div class="today-label">รายจ่ายวันนี้</div>
  <div class="today-amount" id="todayExpense">฿0.00</div>
  <div class="today-income-line" id="todayIncome">รายรับวันนี้: ฿0.00</div>
  <ul class="tx-list" id="todayList"></ul>
</div>

<div class="section-title">
  <span>สรุปรายเดือน</span>
  <span class="backup-links">
    <span id="exportBtn">ส่งออก</span> · <span id="importBtn">นำเข้า</span>
  </span>
</div>
<input type="file" id="importFile" accept="application/json" style="display:none;">
<div id="monthList"></div>

<button class="fab" id="fabAdd" aria-label="เพิ่มรายการ">+</button>

<div class="overlay" id="overlay" style="display:none;">
  <div class="sheet">
    <button class="close-x" id="closeSheet" aria-label="ปิด">✕</button>
    <div class="sheet-title">▸ เพิ่มรายการ</div>

    <div class="type-toggle">
      <div class="type-btn" id="btnExpense">รายจ่าย</div>
      <div class="type-btn" id="btnIncome">รายรับ</div>
    </div>

    <button class="btn-scan" id="scanBtn">📷 สแกนสลิปเพื่ออ่านยอดเงินอัตโนมัติ</button>
    <input type="file" id="slipInput" accept="image/*" style="display:none;">
    <div class="ocr-status" id="ocrStatus" style="display:none;"></div>
    <div class="ocr-raw" id="ocrRaw" style="display:none;"></div>

    <label for="amountInput">จำนวนเงิน (บาท)</label>
    <input type="number" id="amountInput" inputmode="decimal" step="0.01" placeholder="0.00">

    <label>หมวดหมู่</label>
    <div class="cat-grid" id="catGrid"></div>

    <label for="dateInput">วันที่</label>
    <input type="date" id="dateInput">

    <label for="noteInput">โน้ต (ไม่บังคับ)</label>
    <input type="text" id="noteInput" placeholder="เช่น ข้าวเที่ยง, ค่ารถ">

    <div class="btn-row">
      <div class="btn btn-secondary" id="cancelBtn">ยกเลิก</div>
      <div class="btn btn-primary" id="saveBtn">บันทึก</div>
    </div>
  </div>
</div>

<script>
const EXPENSE_CATS = ['อาหาร','เดินทาง','ของใช้','บันเทิง','การเรียน','หอพัก','อื่นๆ'];
const INCOME_CATS = ['เงินจากบ้าน','รายได้พิเศษ','อื่นๆ'];
const MONTH_NAMES = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const STORAGE_KEY = 'wallet-transactions';

let transactions = [];
let currentType = 'expense';
let selectedCat = EXPENSE_CATS[0];

const $ = (id) => document.getElementById(id);

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function fmtMoney(n){
  return '฿' + n.toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function loadTransactions(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    transactions = raw ? JSON.parse(raw) : [];
  }catch(e){
    transactions = [];
  }
}

function saveTransactions(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
  }catch(e){
    alert('บันทึกไม่สำเร็จ: พื้นที่เก็บข้อมูลในเบราว์เซอร์อาจเต็ม');
    console.error(e);
  }
}

function render(){
  renderToday();
  renderMonths();
}

function renderToday(){
  const t = todayStr();
  const todays = transactions.filter(x => x.date === t).sort((a,b)=> b.createdAt - a.createdAt);
  const expenseSum = todays.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
  const incomeSum = todays.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
  $('todayExpense').textContent = fmtMoney(expenseSum);
  $('todayIncome').textContent = 'รายรับวันนี้: ' + fmtMoney(incomeSum);

  const list = $('todayList');
  list.innerHTML = '';
  if(todays.length === 0){
    list.innerHTML = '<div class="empty-note">ยังไม่มีรายการวันนี้ กดปุ่ม + เพื่อเริ่มบันทึก</div>';
    return;
  }
  todays.forEach(tx=>{
    const li = document.createElement('li');
    li.className = 'tx-row';
    li.innerHTML = `
      <div class="tx-left">
        <div class="tx-icon">${tx.type==='expense' ? '−' : '+'}</div>
        <div class="tx-meta">
          <div class="tx-cat">${escapeHtml(tx.category)}</div>
          ${tx.note ? `<div class="tx-note">${escapeHtml(tx.note)}</div>` : ''}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="tx-amount ${tx.type}">${tx.type==='expense'?'-':'+'}${fmtMoney(tx.amount)}</div>
        <button class="tx-del" data-id="${tx.id}" aria-label="ลบรายการ">✕</button>
      </div>
    `;
    list.appendChild(li);
  });
  list.querySelectorAll('.tx-del').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const id = e.currentTarget.getAttribute('data-id');
      if(confirm('ลบรายการนี้หรือไม่?')){
        transactions = transactions.filter(x=>x.id !== id);
        saveTransactions();
        render();
      }
    });
  });
}

function renderMonths(){
  const container = $('monthList');
  container.innerHTML = '';
  if(transactions.length === 0){
    container.innerHTML = '<div class="empty-note pixel-box" style="padding:16px;">ยังไม่มีข้อมูลสรุปรายเดือน</div>';
    return;
  }
  const groups = {};
  transactions.forEach(tx=>{
    const key = tx.date.slice(0,7);
    if(!groups[key]) groups[key] = [];
    groups[key].push(tx);
  });
  const keys = Object.keys(groups).sort().reverse();
  const maxExpense = Math.max(...keys.map(k => groups[k].filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0)), 1);

  keys.forEach(key=>{
    const [y,m] = key.split('-');
    const items = groups[key].sort((a,b)=> b.createdAt - a.createdAt);
    const expense = items.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
    const income = items.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
    const net = income - expense;
    const barPct = Math.min(100, (expense / maxExpense) * 100);

    const details = document.createElement('details');
    details.className = 'month-card pixel-box';
    details.innerHTML = `
      <summary class="month-summary">
        <div class="month-row-top">
          <div class="month-name">${MONTH_NAMES[parseInt(m,10)-1]} ${y}</div>
          <div class="month-net ${net>=0?'pos':'neg'}">${net>=0?'+':'-'}${fmtMoney(Math.abs(net))}</div>
        </div>
        <div class="month-sub">
          <span>รายรับ ${fmtMoney(income)}</span>
          <span>รายจ่าย ${fmtMoney(expense)}</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${barPct}%;"></div></div>
      </summary>
      <div class="month-tx">
        ${items.map(tx => `
          <div class="tx-row">
            <div class="tx-left">
              <div class="tx-icon">${tx.type==='expense' ? '−' : '+'}</div>
              <div class="tx-meta">
                <div class="tx-cat">${escapeHtml(tx.category)}</div>
                <div class="tx-note">${tx.date}${tx.note ? ' · ' + escapeHtml(tx.note) : ''}</div>
              </div>
            </div>
            <div class="tx-amount ${tx.type}">${tx.type==='expense'?'-':'+'}${fmtMoney(tx.amount)}</div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(details);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- Add-transaction sheet ----
function openSheet(){
  $('overlay').style.display = 'flex';
  $('dateInput').value = todayStr();
  $('amountInput').value = '';
  $('noteInput').value = '';
  $('ocrStatus').style.display = 'none';
  $('ocrRaw').style.display = 'none';
  setType('expense');
}
function closeSheet(){
  $('overlay').style.display = 'none';
}
function setType(type){
  currentType = type;
  $('btnExpense').className = 'type-btn' + (type==='expense' ? ' active-expense' : '');
  $('btnIncome').className = 'type-btn' + (type==='income' ? ' active-income' : '');
  renderCatGrid();
}
function renderCatGrid(){
  const cats = currentType === 'expense' ? EXPENSE_CATS : INCOME_CATS;
  selectedCat = cats[0];
  const grid = $('catGrid');
  grid.innerHTML = '';
  cats.forEach(cat=>{
    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (cat === selectedCat ? ' selected' : '');
    chip.textContent = cat;
    chip.addEventListener('click', ()=>{
      selectedCat = cat;
      grid.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
    });
    grid.appendChild(chip);
  });
}

$('fabAdd').addEventListener('click', openSheet);
$('closeSheet').addEventListener('click', closeSheet);
$('cancelBtn').addEventListener('click', closeSheet);
$('btnExpense').addEventListener('click', ()=>setType('expense'));
$('btnIncome').addEventListener('click', ()=>setType('income'));

$('saveBtn').addEventListener('click', ()=>{
  const amount = parseFloat($('amountInput').value);
  if(!amount || amount <= 0){
    alert('กรุณากรอกจำนวนเงินให้ถูกต้อง');
    return;
  }
  const date = $('dateInput').value || todayStr();
  const note = $('noteInput').value.trim();
  transactions.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    type: currentType,
    amount: amount,
    category: selectedCat,
    date: date,
    note: note,
    createdAt: Date.now()
  });
  saveTransactions();
  render();
  closeSheet();
});

// ---- OCR scan ----
$('scanBtn').addEventListener('click', ()=> $('slipInput').click());
$('slipInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = $('ocrStatus');
  const rawEl = $('ocrRaw');
  statusEl.style.display = 'block';
  rawEl.style.display = 'none';
  statusEl.innerHTML = 'กำลังอ่านสลิป<span class="loading-dot">...</span>';
  try{
    const result = await Tesseract.recognize(file, 'eng', {
      logger: (m) => {
        if(m.status === 'recognizing text'){
          statusEl.textContent = `กำลังอ่านสลิป... ${Math.round(m.progress*100)}%`;
        }
      }
    });
    const text = result.data.text || '';
    const amount = extractAmount(text);
    if(amount){
      $('amountInput').value = amount.toFixed(2);
      statusEl.textContent = `อ่านยอดได้ ${fmtMoney(amount)} — กรุณาตรวจสอบก่อนบันทึก`;
    } else {
      statusEl.textContent = 'อ่านยอดเงินอัตโนมัติไม่สำเร็จ กรุณากรอกเอง';
    }
    rawEl.style.display = 'block';
    rawEl.textContent = 'ข้อความที่อ่านได้:\n' + text.trim().slice(0, 500);
  }catch(err){
    statusEl.textContent = 'เกิดข้อผิดพลาดในการอ่านสลิป กรุณากรอกยอดเงินเอง';
    console.error(err);
  }
  e.target.value = '';
});

function extractAmount(text){
  const lines = text.split('\n');
  const decimalRe = /(\d{1,3}(?:,\d{3})*|\d+)\.\d{2}/g;
  const candidates = [];
  lines.forEach(line=>{
    let match;
    decimalRe.lastIndex = 0;
    while((match = decimalRe.exec(line)) !== null){
      const matchStr = match[0];
      const idx = match.index;
      const before = line.slice(Math.max(0, idx-5), idx);
      const after = line.slice(idx+matchStr.length, idx+matchStr.length+5);
      const looksLikeAccountOrRef = /[-xX]/.test(before) || /[-xX]/.test(after);
      const value = parseFloat(matchStr.replace(/,/g,''));
      if(!isNaN(value) && value > 0 && value < 1000000){
        candidates.push({ value, looksLikeAccountOrRef, lineLen: line.trim().length });
      }
    }
  });
  if(candidates.length === 0){
    const intMatches = text.match(/\b\d{2,6}\b/g) || [];
    const nums = intMatches.map(m=>parseFloat(m)).filter(n=>!isNaN(n) && n>0 && n<1000000);
    return nums.length ? Math.max(...nums) : null;
  }
  const clean = candidates.filter(c => !c.looksLikeAccountOrRef);
  const pool = clean.length > 0 ? clean : candidates;
  pool.sort((a,b)=> a.lineLen - b.lineLen || b.value - a.value);
  return pool[0].value;
}

// ---- Export / Import backup ----
$('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(transactions, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wallet-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
});
$('importBtn').addEventListener('click', ()=> $('importFile').click());
$('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const imported = JSON.parse(reader.result);
      if(!Array.isArray(imported)) throw new Error('invalid format');
      if(confirm(`พบ ${imported.length} รายการในไฟล์ ต้องการรวมกับข้อมูลปัจจุบันหรือไม่?`)){
        const existingIds = new Set(transactions.map(t=>t.id));
        imported.forEach(tx=>{
          if(!existingIds.has(tx.id)) transactions.push(tx);
        });
        saveTransactions();
        render();
        alert('นำเข้าข้อมูลสำเร็จ');
      }
    }catch(err){
      alert('ไฟล์ไม่ถูกต้อง กรุณาเลือกไฟล์สำรองข้อมูลที่ส่งออกจากแอปนี้');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ---- init ----
loadTransactions();
render();
</script>
